<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a">
<title>Crop Doctor — Leaf Check</title>
<style>
:root{font:18px/1.45 system-ui,sans-serif;color:#173321;background:#f3f7ed}*{box-sizing:border-box}body{margin:0 auto;padding:12px;max-width:520px}main{background:white;border-radius:16px;padding:16px}h1{font-size:1.5rem;color:#176b3a;margin:0}p{margin:.35rem 0 1rem}label{display:block;font-weight:700;margin-top:.8rem}select,button{width:100%;min-height:54px;margin-top:.4rem;padding:10px;border:2px solid #47745a;border-radius:12px;background:white;color:#173321;font:inherit}select{font-size:1.05rem}#quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#quick button{padding:8px 4px;font-size:.95rem;font-weight:700;line-height:1.2}#quick button:active{background:#176b3a;color:white}button:focus-visible,select:focus-visible{outline:3px solid #e4a927;outline-offset:2px}#result{margin-top:1rem;padding:14px;background:#e8f3e4;border-left:5px solid #176b3a;border-radius:10px}small{display:block;margin-top:1rem;color:#425548}[hidden]{display:none!important}@media(max-width:350px){body{padding:8px}main{padding:12px}#quick{grid-template-columns:1fr}#quick button{min-height:48px}}
</style>
</head>
<body><main>
<h1>🌱 Crop Doctor</h1><p>Choose your crop, then tap a symptom for quick advice. Works offline.</p>
<label for="crop">What are you growing?</label><select id="crop"><option>Maize</option><option>Cassava</option><option>Tomato</option><option>Beans</option><option>Cowpea</option><option>Groundnut</option><option>Rice</option><option>Sorghum</option><option>Banana</option><option>Sweet potato</option><option>Onion</option><option>Cabbage</option></select>
<label>Tap the main symptom</label><div id="quick"><button data-sign="yellow">🟡 Yellow leaves</button><button data-sign="holes">🐛 Holes / bites</button><button data-sign="spots">🟤 Spots / patches</button></div>
<section id="result" aria-live="polite" hidden></section>
<small>Possible causes only, not a sure diagnosis. Check several plants. Use mature compost and clean mulch; ask a local farm adviser if damage spreads quickly. Avoid sprays near harvest and follow local safety advice.</small>
</main>
<script>
const common={yellow:['Yellowing may come from dry or waterlogged soil, low nutrients, or disease.','Check soil moisture and drainage. Add mature compost and mulch with clean crop residues; do not let mulch touch stems.'],holes:['Chewing insects may be present.','Check leaves, undersides, and growing tips. Hand-pick visible insects and egg masses; remove weeds and check again in a few days.'],spots:['Spots may be disease, insects, or weather damage.','Remove badly affected leaves, avoid wetting foliage, improve airflow, and do not compost diseased plants.']};
const special={Maize:{holes:['Caterpillars, including fall armyworm, may feed in the leaf funnel.','Look inside the whorl and hand-pick caterpillars and egg masses. Ask a local adviser about approved biological controls.'],yellow:['Yellowing may be caused by dry or waterlogged soil, low nutrients, or disease.','Check moisture and drainage; mulch and add mature compost. If new leaves show mottled streaks, seek local advice.']},Cassava:{yellow:['Mottled yellow leaves may indicate cassava mosaic disease; whiteflies can spread it.','Use healthy cuttings. Remove severely diseased plants and ask a local adviser; compost will not cure virus disease.']},Tomato:{spots:['Spots can be blight or other leaf disease.','Remove affected leaves, water at soil level, stake plants for airflow, and rotate away from tomatoes and potatoes.']},Beans:{spots:['Leaf spots may be fungal or bacterial disease.','Remove badly affected leaves, avoid handling wet plants, rotate crops, and use clean seed next season.']},Cowpea:{holes:['Aphids, beetles, or caterpillars may be feeding.','Inspect leaf undersides and growing tips; hand-pick larger pests and remove heavily infested leaves.']},Groundnut:{spots:['Leaf spots may be early or late leaf spot disease.','Remove crop debris after harvest, rotate with a non-legume crop, and avoid crowding plants.']},Rice:{yellow:['Yellowing may be caused by water stress, low nutrients, or pests.','Keep water management steady where possible; check stems and leaf bases for insects and ask a local rice adviser before adding inputs.'],holes:['Leaf folder or other caterpillars may be feeding.','Check folded leaves and hand-pick caterpillars; keep field edges clean and protect beneficial insects.']},Sorghum:{holes:['Caterpillars or grasshoppers may chew leaves.','Check growing points and leaf undersides; hand-pick pests where practical and manage nearby weeds.']},Banana:{yellow:['Yellowing may reflect nutrient or water stress, or disease.','Keep soil evenly moist, mulch with clean plant material, and remove only fully dead leaves. Ask locally if leaves yellow in streaks or plants wilt.'],spots:['Leaf spots may be a fungal disease such as Sigatoka.','Remove badly affected leaves, improve airflow, and avoid moving infected leaves between plants.']},'Sweet potato':{holes:['Beetles or caterpillars may be feeding on leaves.','Hand-pick visible pests and eggs; keep the plot weeded and use healthy vines. Check roots at harvest for weevil damage.'],yellow:['Yellowing may be caused by water stress, low nutrients, or disease.','Check drainage and moisture; add mature compost and plant healthy vines.']},Onion:{yellow:['Yellowing or leaf tips drying may be caused by water stress, low nutrients, or disease.','Water at the soil, ensure good drainage, and remove badly affected plants. Avoid planting onions repeatedly in the same spot.'],spots:['Spots may be a fungal leaf disease.','Remove affected leaves, water near the soil, and space plants for airflow.']},Cabbage:{holes:['Caterpillars such as cabbage worms may be eating leaves.','Check leaf undersides and hand-pick caterpillars and eggs. Use fine netting over young plants if available.'],yellow:['Yellowing can come from water stress, low nutrients, or disease.','Keep soil evenly moist, add mature compost, and remove badly affected plants.'],spots:['Spots may be a leaf disease.','Remove badly affected leaves, avoid overhead watering, and rotate cabbage with unrelated crops.']}};
document.getElementById('quick').addEventListener('click',e=>{const b=e.target.closest('[data-sign]');if(!b)return;const crop=document.getElementById('crop').value,symptom=b.dataset.sign,a=(special[crop]&&special[crop][symptom])||common[symptom],r=document.getElementById('result');r.innerHTML='<strong>Possible cause:</strong> '+a[0]+'<br><br><strong>Low-cost next step:</strong> '+a[1];r.hidden=false;r.scrollIntoView({behavior:'smooth',block:'nearest'})});
</script></body></html>
