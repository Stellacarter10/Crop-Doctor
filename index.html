<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3a">
<title>Crop Doctor — Leaf Check</title>
<style>
:root{font:18px/1.45 system-ui,sans-serif;color:#173321;background:#edf5ea;--green:#176b3a;--green-dark:#113f29;--green-soft:#e8f3e4;--gold:#e4a927;--muted:#4f6556;--card:#ffffff;--panel:#f5faf3;--line:#5a7f68}*{box-sizing:border-box}html,body{margin:0;padding:0}body{margin:0 auto;padding:12px;max-width:560px;background:linear-gradient(#edf5ea,#e2efe0)}main{background:var(--card);border-radius:20px;padding:18px 16px 14px;box-shadow:0 8px 24px rgba(23,107,58,.08)}h1{font-size:1.55rem;color:var(--green);margin:0 0 .3rem}p{margin:.4rem 0 .9rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:block}.field label{display:block;font-weight:700;margin-top:.9rem}.field select,button{width:100%;min-height:54px;margin-top:.45rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:#173321;font:inherit;font-size:1.02rem}.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#173321 50%),linear-gradient(135deg,#173321 50%,transparent 50%);background-position:calc(100% - 18px) calc(50% - 3px),calc(100% - 12px) calc(50% - 3px);background-size:6px 6px;background-repeat:no-repeat}#quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:.5rem}.symptom-btn{padding:10px 8px;font-size:.95rem;font-weight:700;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;cursor:pointer;transition:all .15s ease}.symptom-btn.is-selected{background:var(--green);color:white;border-color:var(--green);box-shadow:0 4px 12px rgba(23,107,58,.2)}button:active{transform:translateY(1px)}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}#result{margin-top:1rem;padding:16px;background:var(--panel);border-left:5px solid var(--green);border-radius:12px}#result .tag{display:inline-block;padding:.32rem .7rem;border-radius:999px;background:#dfeee0;color:var(--green-dark);font-size:.78rem;font-weight:700;margin-bottom:.7rem}#result h2{font-size:1rem;margin:.25rem 0 .5rem;color:var(--green-dark)}#result h3{font-size:.9rem;margin:.9rem 0 .35rem;color:var(--green-dark)}#result p, #result li{margin:.25rem 0}#result ul{padding-left:1.2rem;margin:.3rem 0 0}.actions{display:flex;gap:10px;margin-top:12px}.ghost-btn{background:#f4f8f1;color:var(--green-dark);border-color:#87a48d}small{display:block;margin-top:1rem;color:var(--muted);line-height:1.45}[hidden]{display:none!important}@media(max-width:360px){body{padding:8px}main{padding:12px}.row,#quick{grid-template-columns:1fr}.symptom-btn{min-height:52px}}
